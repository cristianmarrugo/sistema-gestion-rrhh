version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    volumes:
     # Este guarda tus cambios del día a día (lo que haces en la web)
      - ./mysql_data:/var/lib/mysql
      # Este le da los datos iniciales al profe (solo se usa la primera vez)
      - ./msql_data/datos_iniciales.sql:/docker-entrypoint-initdb.d/1.sql
    environment:
      - TZ=America/Bogota
      - MYSQL_DATABASE=rrhh_db
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3307:3306"

  app:
    image: marrugocb/rrhh-app:v1
    container_name: spring-app
    ports:
      - "8080:8080"

    restart: on-failure
    environment:
      # Aquí conectamos con los datos de arriba
      - TZ=America/Bogota
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/rrhh_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PYTHON_EXE_PATH=/usr/bin/python3

      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}

    depends_on:
      - db