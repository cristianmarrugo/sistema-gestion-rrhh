version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      - MYSQL_DATABASE=rrhh_db
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: spring-app
    ports:
      - "8080:8080"
    environment:
      # Aquí conectamos con los datos de arriba
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/rrhh_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PYTHON_EXE_PATH=/usr/bin/python3
    depends_on:
      - db