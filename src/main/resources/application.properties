spring.application.name=gestion


spring.datasource.url=jdbc:mysql://localhost:3306/rrhh_db
spring.datasource.username=root
spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# Formato fechas
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Permitir que el GlobalExceptionHandler maneje el 404
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Usamos el prefijo de OpenAI porque la librería es compatible
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

# Esta es la ruta (URL) que pedías para conectar con Groq
spring.ai.openai.base-url=https://api.groq.com/openai

# El modelo gratuito más potente de Groq actualmente
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile



