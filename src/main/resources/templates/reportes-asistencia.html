<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .badge-estado {
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
    }
    .estado-NORMAL { background-color: #d4edda; color: #155724; }
    .estado-TARDE { background-color: #fff3cd; color: #856404; }
    .estado-AUSENTE { background-color: #f8d7da; color: #721c24; }
    .estado-PERMISO { background-color: #d1ecf1; color: #0c5460; }
    .estado-VACACIONES { background-color: #e2e3e5; color: #383d41; }
  </style>
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="mb-0"></h3>
    <small class="text-muted"></small>
  </div>
  <div>
    <a href="/index" class="btn btn-outline-secondary">
       Volver al inicio
    </a>
  </div>
</div>

<div class="container-fluid mt-4">
  <h2 class="mb-4">📊 Reportes de Asistencia</h2>

  <!-- FILTROS -->
  <div class="card shadow mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">📅 Desde</label>
          <input type="date" id="filtroDesde" class="form-control" onchange="cargarAsistencias()">
        </div>
        <div class="col-md-2">
          <label class="form-label">📅 Hasta</label>
          <input type="date" id="filtroHasta" class="form-control" onchange="cargarAsistencias()">
        </div>
        <div class="col-md-2">
          <label class="form-label">👤 Empleado</label>
          <select id="filtroEmpleado" class="form-select" onchange="cargarAsistencias()">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">📊 Estado</label>
          <select id="filtroEstado" class="form-select" onchange="cargarAsistencias()">
            <option value="">Todos</option>
            <option value="NORMAL">Normal</option>
            <option value="TARDE">Tarde</option>
            <option value="AUSENTE">Ausente</option>
            <option value="PERMISO">Permiso</option>
            <option value="VACACIONES">Vacaciones</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">&nbsp;</label>
          <button class="btn btn-success w-100" onclick="exportarExcel()">
            📥 Exportar Excel
          </button>
        </div>
        <div class="col-md-2">
          <label class="form-label">&nbsp;</label>
          <button class="btn btn-secondary w-100" onclick="limpiarFiltros()">
            🔄 Limpiar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ESTADÍSTICAS -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card bg-success text-white">
        <div class="card-body">
          <h6>✅ Normal</h6>
          <h3 id="statNormal">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card bg-warning">
        <div class="card-body">
          <h6>⏰ Tarde</h6>
          <h3 id="statTarde">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card bg-danger text-white">
        <div class="card-body">
          <h6>❌ Ausente</h6>
          <h3 id="statAusente">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card bg-info text-white">
        <div class="card-body">
          <h6>📄 Permiso</h6>
          <h3 id="statPermiso">0</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">📋 Registros de Asistencia</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
          <tr>
            <th>Fecha</th>
            <th>Empleado</th>
            <th>Documento</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Horas</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody id="tablaAsistencias">
          <tr><td colspan="7" class="text-center">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let todasAsistencias = [];

  document.addEventListener('DOMContentLoaded', function() {
      const hoy = new Date().toISOString().split('T')[0];
      const hace7dias = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];

      document.getElementById('filtroDesde').value = hace7dias;
      document.getElementById('filtroHasta').value = hoy;

      cargarEmpleados();
      cargarAsistencias();
  });

  function cargarEmpleados() {
      fetch('/api/empleados')
          .then(r => r.json())
          .then(empleados => {
              const select = document.getElementById('filtroEmpleado');
              empleados.forEach(e => {
                  const opt = document.createElement('option');
                  opt.value = e.id;
                  opt.textContent = `${e.nombre} ${e.apellido}`;
                  select.appendChild(opt);
              });
          });
  }

  function cargarAsistencias() {
      fetch('/api/asistencias')
          .then(r => r.json())
          .then(data => {
              todasAsistencias = data;
              aplicarFiltros();
          })
          .catch(() => {
              document.getElementById('tablaAsistencias').innerHTML =
                  '<tr><td colspan="7" class="text-center text-danger">Error al cargar</td></tr>';
          });
  }

  function aplicarFiltros() {
      const desde = document.getElementById('filtroDesde').value;
      const hasta = document.getElementById('filtroHasta').value;
      const empleadoId = document.getElementById('filtroEmpleado').value;
      const estado = document.getElementById('filtroEstado').value;

      let filtradas = todasAsistencias.filter(a => {
          if (desde && a.fecha < desde) return false;
          if (hasta && a.fecha > hasta) return false;
          if (empleadoId && a.empleado.id != empleadoId) return false;
          if (estado && a.estado !== estado) return false;
          return true;
      });

      renderizarTabla(filtradas);
      actualizarEstadisticas(filtradas);
  }

  function renderizarTabla(asistencias) {
      const tbody = document.getElementById('tablaAsistencias');

      if (asistencias.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay registros</td></tr>';
          return;
      }

      tbody.innerHTML = asistencias.map(a => {
          const horas = calcularHoras(a.horaEntrada, a.horaSalida);
          return `
              <tr>
                  <td>${a.fecha}</td>
                  <td><strong>${a.empleado.nombre} ${a.empleado.apellido}</strong></td>
                  <td>${a.empleado.documento}</td>
                  <td>${a.horaEntrada || '-'}</td>
                  <td>${a.horaSalida || '-'}</td>
                  <td>${horas}</td>
                  <td><span class="badge badge-estado estado-${a.estado}">${a.estado}</span></td>
              </tr>
          `;
      }).join('');
  }

  function calcularHoras(entrada, salida) {
      if (!entrada || !salida) return '-';
      const [hE, mE] = entrada.split(':').map(Number);
      const [hS, mS] = salida.split(':').map(Number);
      const mins = (hS * 60 + mS) - (hE * 60 + mE);
      return `${Math.floor(mins/60)}h ${mins%60}m`;
  }

  function actualizarEstadisticas(asistencias) {
      const stats = {
          NORMAL: 0,
          TARDE: 0,
          AUSENTE: 0,
          PERMISO: 0
      };

      asistencias.forEach(a => {
          if (stats.hasOwnProperty(a.estado)) {
              stats[a.estado]++;
          }
      });

      document.getElementById('statNormal').textContent = stats.NORMAL;
      document.getElementById('statTarde').textContent = stats.TARDE;
      document.getElementById('statAusente').textContent = stats.AUSENTE;
      document.getElementById('statPermiso').textContent = stats.PERMISO;
  }

  function exportarExcel() {
      const desde = document.getElementById('filtroDesde').value;
      const hasta = document.getElementById('filtroHasta').value;

      if (!desde || !hasta) {
          alert('Selecciona rango de fechas');
          return;
      }

      const url = `/api/reportes/exportar-rango?desde=${desde}&hasta=${hasta}`;
      window.open(url, '_blank');
  }

  function limpiarFiltros() {
      const hoy = new Date().toISOString().split('T')[0];
      const hace7dias = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];

      document.getElementById('filtroDesde').value = hace7dias;
      document.getElementById('filtroHasta').value = hoy;
      document.getElementById('filtroEmpleado').value = '';
      document.getElementById('filtroEstado').value = '';

      cargarAsistencias();
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
