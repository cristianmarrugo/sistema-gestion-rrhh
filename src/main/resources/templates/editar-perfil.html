<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Perfil - Sistema RRHH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">✏️ Editar Mi Perfil</h4>
                </div>
                <div class="card-body">

                    <form th:action="@{/mi-perfil/editar}" method="post">
                        <input type="hidden" name="id" th:value="${empleado.id}">

                        <div class="alert alert-info">
                            <small>
                                ℹ️ Solo puedes editar tu email.
                                Para cambiar otros datos, contacta con RRHH.
                            </small>
                        </div>

                        <!-- Información no editable -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control"
                                       th:value="${empleado.nombre + ' ' + empleado.apellido}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Documento</label>
                                <input type="text" class="form-control"
                                       th:value="${empleado.documento}"
                                       readonly disabled>
                            </div>
                        </div>

                        <!-- Email - EDITABLE -->
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${empleado.email}"
                                   required>
                        </div>

                        <!-- Teléfono - EDITABLE (si existe en tu modelo) -->
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text"
                                   name="telefono"
                                   class="form-control"
                                   placeholder="Ej: 3001234567">
                            <small class="text-muted">
                                Campo opcional - Actualmente no implementado en el modelo
                            </small>
                        </div>

                        <!-- Dirección - EDITABLE (si existe en tu modelo) -->
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea name="direccion"
                                      class="form-control"
                                      rows="2"
                                      placeholder="Ej: Calle 123 #45-67"></textarea>
                            <small class="text-muted">
                                Campo opcional - Actualmente no implementado en el modelo
                            </small>
                        </div>

                        <!-- Información no editable -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Cargo</label>
                                <input type="text" class="form-control"
                                       th:value="${empleado.cargo != null ? empleado.cargo.nombre : 'Sin cargo'}"
                                       readonly disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha de ingreso</label>
                                <input type="text" class="form-control"
                                       th:value="${#temporals.format(empleado.fechaIngreso, 'dd/MM/yyyy')}"
                                       readonly disabled>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/mi-perfil" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">💾 Guardar cambios</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
