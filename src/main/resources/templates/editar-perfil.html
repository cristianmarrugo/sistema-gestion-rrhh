<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil | Sistema RRHH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-white py-3">
                    <h5 class="m-0 fw-bold text-primary">Actualizar mis datos</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger shadow-sm">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Error al actualizar</span>
                    </div>

                    <form th:action="@{/mi-perfil/editar}" method="post">
                        <input type="hidden" name="id" th:value="${empleado.id}">

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Nombre Completo</label>
                            <input type="text" class="form-control bg-light" th:value="${empleado.nombre + ' ' + empleado.apellido}" readonly>
                            <div class="form-text">El nombre solo puede ser cambiado por RRHH.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" th:value="${empleado.email}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono / Celular</label>
                            <input type="text" name="telefono" class="form-control" th:value="${empleado.telefono}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Fecha de Nacimiento</label>
                            <input type="date" name="fechaNacimiento" class="form-control" th:value="${empleado.fechaNacimiento}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Dirección de Residencia</label>
                            <input type="text" name="direccion" class="form-control" th:value="${empleado.direccion}">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            <a th:href="@{/mi-perfil}" class="btn btn-link text-muted">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
