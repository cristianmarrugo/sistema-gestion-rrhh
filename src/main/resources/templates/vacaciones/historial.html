<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Auditoría - Vacaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .timeline { position: relative; padding: 20px 0; list-style: none; }
        .timeline:before {
            content: ""; position: absolute; top: 0; bottom: 0; left: 40px;
            width: 2px; background: #e9ecef;
        }
        .timeline-item { position: relative; margin-bottom: 30px; padding-left: 70px; }
        .timeline-marker {
            position: absolute; left: 31px; width: 20px; height: 20px;
            border-radius: 50%; background: #0d6efd; border: 3px solid #fff;
        }
        .card-audit { border: none; border-radius: 12px; transition: 0.3s; }
        .card-audit:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .badge-status { font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-clock-history me-2"></i>Historial de Cambios</h2>
        <a th:href="@{/permisos}" class="btn btn-outline-dark btn-sm">Volver</a>
    </div>

    <div class="timeline">
        <div th:each="p, iter : ${historial}" class="timeline-item">
            <div class="timeline-marker"></div>
            <div class="card card-audit shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0">
                            Estado:
                            <span th:classappend="${p.estado.name() == 'APROBADO' ? 'text-success' : (p.estado.name() == 'RECHAZADO' ? 'text-danger' : 'text-warning')}"
                                  th:text="${p.estado}">PENDIENTE</span>
                        </h5>
                        <small class="text-muted" th:text="${#temporals.format(p.fechaActualizacion, 'dd/MM/yyyy HH:mm')}">Fecha</small>
                    </div>

                    <p class="card-text mb-1"><strong>Motivo:</strong> <span th:text="${p.motivo}">...</span></p>

                    <div class="mt-3 p-2 bg-light rounded border-start border-4"
                         th:classappend="${p.aprobadoPor != null ? 'border-success' : 'border-secondary'}">
                        <small class="text-muted d-block">Acción realizada por:</small>
                        <strong th:text="${p.aprobadoPor != null ? p.aprobadoPor : p.empleado.nombre + ' ' + p.empleado.apellido}">Sistema</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
