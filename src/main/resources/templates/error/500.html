<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error de Sistema - 500</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .error-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .icon-box { font-size: 4rem; color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card error-card text-center p-5">
                <div class="icon-box mb-3">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h1 class="fw-bold text-dark">500</h1>
                <h3 th:text="${error}">Error Interno</h3>
                <p class="text-muted" th:text="${mensaje}">Ocurrió un problema de mapeo en el servidor.</p>

                <div class="d-grid gap-2 d-md-block mt-4">
                    <a th:href="@{/index}" class="btn btn-dark px-4 me-md-2">
                        <i class="bi bi-house-door"></i> Inicio
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary px-4">
                        Regresar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
