<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control RRHH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table thead { background-color: #2c3e50; color: white; }
        .badge-PENDIENTE { background-color: #f1c40f; color: black; }
        .badge-RESUELTO { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>🛠️ Panel de Gestión Administrativa</h3>
        <a href="/index" class="btn btn-outline-secondary btn-sm">Volver al Inicio</a>
    </div>

    <div class="card mb-5">
        <div class="card-header bg-primary text-white font-weight-bold">📨 Solicitudes y PQRS de Empleados</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Tipo</th>
                    <th>Asunto</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${todosLosPQRS}">
                    <td th:text="${p.empleado.nombre + ' ' + p.empleado.apellido}"></td>
                    <td th:text="${p.tipo}"></td>
                    <td th:text="${p.asunto}"></td>
                    <td th:text="${p.fechaCreacion}"></td>
                    <td><span th:class="'badge badge-' + ${p.estado}" th:text="${p.estado}"></span></td>
                    <td>
                        <button th:if="${p.estado == 'PENDIENTE'}"
                                class="btn btn-sm btn-success"
                                th:onclick="'prepararRespuesta(' + ${p.id} + ')'"
                                data-bs-toggle="modal" data-bs-target="#modalRespuesta">
                            Responder
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mb-3">
        <input type="text" id="buscadorEmpleado" class="form-control" placeholder="🔍 Buscar por nombre de empleado...">
    </div>
    <div class="card">
        <div class="card-header bg-dark text-white font-weight-bold">📁 Auditoría de Documentos Subidos</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="tablaDocumentos">
                <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Tipo Documento</th>
                    <th>Fecha Subida</th>
                    <th>Archivo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doc : ${todosLosDocumentos}">
                    <td th:text="${doc.empleado.nombre + ' ' + doc.empleado.apellido}"></td>
                    <td th:text="${doc.tipo}"></td>
                    <td th:text="${doc.fechaSubida}"></td>
                    <td>
                        <a th:href="@{'/uploads/documentos/' + ${doc.empleado.documento} + '/' + ${doc.nombre}}" target="_blank" class="btn btn-sm btn-outline-primary">
                            👁️ Ver PDF
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalRespuesta" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/empleado/admin/pqrs/responder}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Responder a Solicitud</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id" id="pqrsId">
                <textarea name="respuesta" class="form-control" rows="4" placeholder="Escribe la respuesta oficial..." required></textarea>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Enviar Respuesta</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function prepararRespuesta(id) {
        document.getElementById('pqrsId').value = id;
    }

    document.getElementById('buscadorEmpleado').addEventListener('keyup', function() {
        let filtro = this.value.toLowerCase();
        let filas = document.querySelectorAll("#tablaDocumentos tbody tr");
        filas.forEach(fila => {
            let nombre = fila.cells[0].textContent.toLowerCase();
            fila.style.display = nombre.includes(filtro) ? "" : "none";
        });
    });
</script>
</body>
</html>
