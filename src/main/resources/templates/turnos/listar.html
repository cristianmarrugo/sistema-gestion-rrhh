<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Turnos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>🕐 Gestión de Turnos</h3>
        <div>
            <a href="/cuadrantes" class="btn btn-info me-2">Ver Cuadrantes</a>
            <a href="/turnos/nuevo" class="btn btn-success">+ Nuevo Turno</a>
            <a href="/index" class="btn btn-secondary">Volver</a>
        </div>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        ✅ Turno guardado correctamente
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Horario</th>
                    <th>Tolerancia</th>
                    <th>Días</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="turno : ${turnos}">
                    <td>
                            <span class="badge" th:style="'background-color:' + ${turno.color}"
                                  th:text="${turno.codigo}"></span>
                    </td>
                    <td th:text="${turno.nombre}"></td>
                    <td th:text="${turno.horaEntrada} + ' - ' + ${turno.horaSalida}"></td>
                    <td th:text="${turno.toleranciaMinutos} + ' min'"></td>
                    <td>
                        <small>
                            <span th:if="${turno.lunes}">L </span>
                            <span th:if="${turno.martes}">M </span>
                            <span th:if="${turno.miercoles}">X </span>
                            <span th:if="${turno.jueves}">J </span>
                            <span th:if="${turno.viernes}">V </span>
                            <span th:if="${turno.sabado}">S </span>
                            <span th:if="${turno.domingo}">D</span>
                        </small>
                    </td>
                    <td>
                        <a th:href="@{/turnos/editar/{id}(id=${turno.id})}"
                           class="btn btn-sm btn-warning">Editar</a>

                        <form th:if="${empleado.rol.toString() == 'ADMIN'}"
                              th:action="@{/turnos/eliminar/{id}(id=${turno.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('¿Eliminar turno?');">
                            <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
