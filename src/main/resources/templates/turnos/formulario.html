<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Turno</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 th:text="${turno.id != null ? 'Editar Turno' : 'Nuevo Turno'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/turnos/guardar}" method="post" th:object="${turno}">
                        <input type="hidden" th:field="*{id}">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>Nombre *</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>
                            <div class="col-md-6">
                                <label>Código *</label>
                                <input type="text" class="form-control" th:field="*{codigo}"
                                       maxlength="10" required>
                                <small class="text-muted">Ej: M, T, N</small>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label>Hora Entrada *</label>
                                <input type="time" class="form-control" th:field="*{horaEntrada}" required>
                            </div>
                            <div class="col-md-4">
                                <label>Hora Salida *</label>
                                <input type="time" class="form-control" th:field="*{horaSalida}" required>
                            </div>
                            <div class="col-md-4">
                                <label>Tolerancia (min) *</label>
                                <input type="number" class="form-control" th:field="*{toleranciaMinutos}"
                                       value="15" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label>Color</label>
                            <input type="color" class="form-control" th:field="*{color}" value="#10B981">
                        </div>

                        <div class="mb-3">
                            <label>Días de aplicación</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{lunes}">
                                <label class="form-check-label">Lunes</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{martes}">
                                <label class="form-check-label">Martes</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{miercoles}">
                                <label class="form-check-label">Miércoles</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{jueves}">
                                <label class="form-check-label">Jueves</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{viernes}">
                                <label class="form-check-label">Viernes</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{sabado}">
                                <label class="form-check-label">Sábado</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" th:field="*{domingo}">
                                <label class="form-check-label">Domingo</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label>Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/turnos" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
