<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Marcar Asistencia</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="shortcut icon" href="/img/icono-rrhh.jpg" type="image/jpg">

    <style>
        .clock {
            font-size: 4rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .date {
            font-size: 1.5rem;
            color: #6c757d;
        }
        .btn-marcar {
            font-size: 1.5rem;
            padding: 20px 60px;
            border-radius: 50px;
        }
        .estado-badge {
            font-size: 1.2rem;
            padding: 10px 20px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Header -->
            <div class="text-center mb-4">
                <h2>⏱️ Control de Asistencia</h2>
                <p class="text-muted">Registra tu entrada y salida</p>
            </div>

            <!-- Reloj en tiempo real -->
            <div class="card shadow mb-4">
                <div class="card-body text-center">
                    <div id="clock" class="clock">--:--:--</div>
                    <div id="date" class="date">-- de --------- de ----</div>
                </div>
            </div>

            <!-- Estado actual -->
            <div id="estadoActual" class="card shadow mb-4 d-none">
                <div class="card-body">
                    <h5 class="card-title"> Tu asistencia de hoy</h5>
                    <div id="infoAsistencia"></div>
                </div>
            </div>

            <!-- Alertas -->
            <div id="alertContainer"></div>

            <!-- Botón principal -->
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <button id="btnMarcar"
                            class="btn btn-primary btn-marcar"
                            onclick="marcarAsistencia()">
                         Marcar Asistencia
                    </button>
                    <p class="text-muted mt-3">
                        Click para registrar tu entrada o salida
                    </p>
                </div>
            </div>

            <!-- Botones secundarios -->
            <div class="text-center mt-4">
                <a href="/index" class="btn btn-secondary"> Volver al inicio</a>
            </div>

        </div>
    </div>
</div>

<script>
    // Reloj en tiempo real
    function actualizarReloj() {
        const ahora = new Date();

        // Hora
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        const segundos = String(ahora.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${horas}:${minutos}:${segundos}`;

        // Fecha
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const fecha = ahora.toLocaleDateString('es-ES', opciones);
        document.getElementById('date').textContent = fecha;
    }

    // Actualizar cada segundo
    setInterval(actualizarReloj, 1000);
    actualizarReloj(); // Llamar inmediatamente

    // Cargar estado actual al cargar la página
    window.addEventListener('DOMContentLoaded', function() {
        cargarEstadoActual();
    });

    // Función para cargar el estado actual de asistencia
    function cargarEstadoActual() {
        fetch('/api/asistencias/mi-asistencia-hoy')
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                // Si no hay asistencia hoy, no hacer nada
                return null;
            })
            .then(data => {
                if (data) {
                    mostrarEstadoActual(data);
                }
            })
            .catch(error => {
                console.error('Error al cargar estado:', error);
            });
    }

    // Mostrar estado actual
    function mostrarEstadoActual(asistencia) {
        const card = document.getElementById('estadoActual');
        const info = document.getElementById('infoAsistencia');

        let html = `
            <div class="row">
                <div class="col-md-6">
                    <p><strong>📅 Fecha:</strong> ${asistencia.fecha}</p>
                    <p><strong>🕐 Entrada:</strong> ${asistencia.horaEntrada || 'No registrada'}</p>
                </div>
                <div class="col-md-6">
                    <p><strong>🕐 Salida:</strong> ${asistencia.horaSalida || 'No registrada'}</p>
                    <p><strong>📊 Estado:</strong>
                        <span class="badge estado-badge ${getBadgeClass(asistencia.estado)}">
                            ${asistencia.estado}
                        </span>
                    </p>
                </div>
            </div>
        `;

        info.innerHTML = html;
        card.classList.remove('d-none');
    }

    // Obtener clase de badge según el estado
    function getBadgeClass(estado) {
        switch(estado) {
            case 'NORMAL': return 'bg-success';
            case 'TARDE': return 'bg-warning';
            case 'AUSENTE': return 'bg-danger';
            case 'PERMISO': return 'bg-info';
            case 'VACACIONES': return 'bg-primary';
            default: return 'bg-secondary';
        }
    }

    // Marcar asistencia
    function marcarAsistencia() {
        const btn = document.getElementById('btnMarcar');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Registrando...';

        fetch('/api/asistencias/marcar', {
            method: 'POST'
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    throw new Error(text);
                });
            }
            return response.json();
        })
        .then(data => {
            mostrarAlerta(
                ' Asistencia registrada correctamente',
                'success',
                data
            );

            // Actualizar estado
            mostrarEstadoActual(data);

            // Habilitar botón después de 2 segundos
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '🕐 Marcar Asistencia';
            }, 2000);
        })
        .catch(error => {
            mostrarAlerta(' Error: ' + error.message, 'danger');

            // Habilitar botón
            btn.disabled = false;
            btn.innerHTML = '🕐 Marcar Asistencia';
        });
    }

    // Mostrar alerta
    function mostrarAlerta(mensaje, tipo, data) {
        const container = document.getElementById('alertContainer');

        let detalles = '';
        if (data) {
            if (data.horaEntrada && !data.horaSalida) {
                detalles = `<small class="d-block mt-2">Entrada registrada a las <strong>${data.horaEntrada}</strong></small>`;
            } else if (data.horaSalida) {
                detalles = `<small class="d-block mt-2">Salida registrada a las <strong>${data.horaSalida}</strong></small>`;
            }
        }

        container.innerHTML = `
            <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                ${mensaje}
                ${detalles}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;

        // Auto-ocultar después de 5 segundos
        setTimeout(() => {
            container.innerHTML = '';
        }, 5000);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
