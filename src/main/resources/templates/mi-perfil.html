<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mi Perfil - Sistema RRHH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Alerta de éxito -->
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
                ✅ Perfil actualizado correctamente
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">👤 Mi Perfil</h4>
                </div>
                <div class="card-body">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Nombre completo:</strong>
                            <p th:text="${empleado.nombre + ' ' + empleado.apellido}"></p>
                        </div>
                        <div class="col-md-6">
                            <strong>Documento:</strong>
                            <p th:text="${empleado.documento}"></p>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Email:</strong>
                            <p th:text="${empleado.email}"></p>
                        </div>
                        <div class="col-md-6">
                            <strong>Rol:</strong>
                            <p>
                                <span class="badge bg-secondary" th:text="${empleado.rol}"></span>
                            </p>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Cargo:</strong>
                            <p th:text="${empleado.cargo != null ? empleado.cargo.nombre : 'Sin cargo'}"></p>
                        </div>
                        <div class="col-md-6"
                             th:if="${empleado.rol.toString() == 'ADMIN' or empleado.rol.toString() == 'RRHH'}">
                            <strong>Salario base:</strong>
                            <p th:text="${empleado.cargo != null ? '$' + empleado.cargo.salarioBase : '-'}"></p>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Fecha de ingreso:</strong>
                            <p th:text="${#temporals.format(empleado.fechaIngreso, 'dd/MM/yyyy')}"></p>
                        </div>
                        <div class="col-md-6">
                            <strong>Estado:</strong>
                            <p>
                                <span th:if="${empleado.activo}" class="badge bg-success">Activo</span>
                                <span th:unless="${empleado.activo}" class="badge bg-danger">Inactivo</span>
                            </p>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <strong>Horario:</strong>
                            <p th:if="${empleado.horario != null}"
                               th:text="${empleado.horario.nombre + ' (' + empleado.horario.horaEntrada + ' - ' + empleado.horario.horaSalida + ')'}">
                            </p>
                            <p th:unless="${empleado.horario != null}" class="text-muted">
                                Sin horario asignado
                            </p>
                        </div>
                    </div>

                </div>
                <div class="card-footer bg-white">
                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">← Volver al inicio</a>
                        <a href="/mi-perfil/editar" class="btn btn-primary">✏️ Editar perfil</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
