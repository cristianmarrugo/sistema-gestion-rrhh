<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">👥 Gestión de Empleados</h2>

    <!-- FORMULARIO -->
    <div class="card mb-4">
        <div class="card-header">
            Crear / Editar Empleado
        </div>
        <div class="card-body">

            <form th:action="@{/empleados/guardar}" th:object="${nuevoEmpleado}" method="post">

                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-4">
                        <label>Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>

                    <div class="col-md-4">
                        <label>Apellido</label>
                        <input type="text" class="form-control" th:field="*{apellido}" required>
                    </div>

                    <div class="col-md-4">
                        <label>Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-4">
                        <label>Documento</label>
                        <input type="text" class="form-control" th:field="*{documento}">
                    </div>

                    <div class="col-md-4">
                        <label>PIN</label>
                        <input type="text" class="form-control" th:field="*{pin}">
                    </div>

                    <div class="col-md-4">
                        <label>Rol</label>
                        <select class="form-select" th:field="*{rol}">
                            <option th:each="r : ${T(com.example.demo.model.Rol).values()}"
                                    th:value="${r}"
                                    th:text="${r}">
                            </option>
                        </select>
                    </div>
                </div>

                <button class="btn btn-primary mt-3">
                    Guardar
                </button>
            </form>

        </div>
    </div>

    <!-- TABLA -->
    <div class="card">
        <div class="card-header">
            Lista de Empleados
        </div>

        <div class="card-body">

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="emp : ${empleados}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.nombre + ' ' + emp.apellido}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.rol}"></td>
                    <td>
                        <span th:if="${emp.activo}" class="badge bg-success">Activo</span>
                        <span th:if="${!emp.activo}" class="badge bg-danger">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{'/empleados/editar/' + ${emp.id}}"
                           class="btn btn-warning btn-sm">Editar</a>

                        <a th:href="@{'/empleados/desactivar/' + ${emp.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro que deseas desactivar?')">
                            Desactivar
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>

            <a href="/index" class="btn-volver">⬅ Volver al inicio</a>

        </div>
    </div>

</div>

</body>
</html>
